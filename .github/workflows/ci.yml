name: CI

# GAP-014: the AGENTS.md verification gate, run on every push and PR.
#
# `core-back` runs in its own job against real PostgreSQL 18 and Redis service containers on the
# ports the test harness defaults to (55432 / 56379). Its database suites skip themselves when a
# service is unreachable, and a skipped suite still reports green, so that job FAILS when bun
# reports any skipped test: a ledger or governance regression must never pass because the
# database was silently missing.
on:
  push:
    # `master` is the repository's default branch; `main` and `ayoub` are kept for compatibility.
    branches: [master, main, ayoub]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # two commits so HEAD^1 exists (a shallow clone would make `git show` treat the whole tree as added)
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/project-design/build.ts --check
      - run: bun scripts/project-design/check.ts
      - name: Whitespace check of the change under test
        run: |
          if git rev-parse --verify -q HEAD^1 >/dev/null; then git diff --check HEAD^1 HEAD; fi

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install @pg/ui
        working-directory: packages/ui
        run: bun install --frozen-lockfile
      - name: UI governance audit (UI-01..UI-11)
        run: bun run ui:audit
      - name: Icon registry is current
        run: bun run ui:icons:check
      - name: Typecheck @pg/ui
        run: bun run ui:typecheck
      - name: Test @pg/ui
        run: bun run ui:test

  core-back:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: payment_gateway_monolith_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55432/payment_gateway_monolith_test
      POSTGRES_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/payment_gateway_monolith_test
      STORAGE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/payment_gateway_monolith_test
      EXHAUSTIVE_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/payment_gateway_monolith_test
      STORAGE_TEST_REDIS_URL: redis://127.0.0.1:56379
      REDIS_URL: redis://127.0.0.1:56379
    defaults:
      run:
        working-directory: core-back
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Install sibling workspaces imported by core-back tests
        working-directory: .
        run: |
          for workspace in admin-back deploy deploy/backup-daemon; do
            (cd "$workspace" && bun install --frozen-lockfile)
          done
      - name: Generate the Prisma client
        run: bun run migrate-generate
      - name: Generate the internal mTLS test certificates
        run: bun run generate-mtls-certs
      - name: Verify PostgreSQL 18
        run: |
          version_num="$(psql "$DATABASE_URL" -tAc 'SHOW server_version_num')"
          echo "server_version_num=$version_num"
          test "$version_num" -ge 180000
      - name: Apply migrations to the test database
        run: bun run migrate-deploy
      - name: Guard SQL-only schema objects
        run: bun run schema:sql-only-check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          bun test 2>&1 | tee "$RUNNER_TEMP/core-back-test.log"
      - name: Fail when any suite was skipped
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*[1-9][0-9]* skip' "$RUNNER_TEMP/core-back-test.log"; then
            echo "::error::bun reported skipped tests: a database or Redis suite did not run."
            grep -E '^[[:space:]]*[0-9]+ (pass|skip|fail)' "$RUNNER_TEMP/core-back-test.log"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - deploy
          - deploy/backup-daemon
          - deploy/object-storage-daemon
          - admin-back
          - merchant-back
          - checkout-back
          - fake-rails-back
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (frozen lockfile)
        working-directory: ${{ matrix.workspace }}
        run: bun install --frozen-lockfile
      - name: Install sibling workspaces imported across workspace boundaries
        if: startsWith(matrix.workspace, 'deploy')
        run: |
          for workspace in core-back deploy deploy/backup-daemon admin-back; do
            if [ "$workspace" != "${{ matrix.workspace }}" ]; then (cd "$workspace" && bun install --frozen-lockfile); fi
          done
      - name: Typecheck
        working-directory: ${{ matrix.workspace }}
        run: bun run typecheck
      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: bun test

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - admin-front
          - merchant-front
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (frozen lockfile)
        working-directory: ${{ matrix.workspace }}
        run: bun install --frozen-lockfile
      - name: Unit and content tests
        working-directory: ${{ matrix.workspace }}
        run: bun run test:unit

  tests-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (frozen lockfile)
        working-directory: tests
        run: bun install --frozen-lockfile
      - name: Install the frontends whose sources the unit tests import
        run: |
          for workspace in admin-front merchant-front checkout-front fake-rails-front; do
            (cd "$workspace" && bun install --frozen-lockfile)
          done
      - name: Root Vitest suite
        working-directory: tests
        run: bun run test:unit

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - admin-front
          - merchant-front
          - checkout-front
          - fake-rails-front
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (frozen lockfile)
        working-directory: ${{ matrix.workspace }}
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: bun run build

  # One-command Codespaces launcher: validate the dev container files and really boot the `core`
  # profile (PostgreSQL 18, mTLS certificates, migrations, seeds, core-back over mTLS) so the
  # Codespaces path cannot silently rot. The portal profiles are not booted here; run
  # `./scripts/codespaces-start.sh smoke` manually in a Codespace (TRACKER GAP-079).
  codespaces:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: payment_gateway_monolith_ci
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "55433"
      DB_NAME: payment_gateway_monolith_ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Shell syntax
        run: |
          bash -n scripts/codespaces-start.sh
          bash -n scripts/deploy-localhost.sh
          bash -n .devcontainer/post-create.sh
      - name: devcontainer.json is valid JSONC
        run: |
          bun -e 'const t = await Bun.file(".devcontainer/devcontainer.json").text(); JSON.parse(t.replace(/^\s*\/\/.*$/gm, "")); console.log("devcontainer.json OK")'
      - name: Compose file is valid
        run: docker compose -f .devcontainer/docker-compose.yml config -q
      - name: Boot the core profile
        run: ./scripts/codespaces-start.sh start core
      - name: core-back rejects a client without a certificate (mTLS enforced)
        run: |
          if curl -ksf --max-time 5 https://127.0.0.1:4000/health >/dev/null; then
            echo "::error::core-back answered a request that carried no client certificate"; exit 1
          fi
          echo "rejected as expected"
      - name: Second start is idempotent (no reseed, no reset)
        run: ./scripts/codespaces-start.sh start core
      - name: Stop
        if: always()
        run: ./scripts/codespaces-start.sh stop
      - name: Service logs on failure
        if: failure()
        run: tail -n 120 .local/codespaces/logs/*.log || true
