name: Deploy Admin Edge API (legacy, manual)

# LEGACY single-service deploy (GAP-014). The supported path is the multi-host
# deploy engine in deploy/ (`bun run deploy`). This workflow is manual-only,
# runs the service tests first, pins the server host key (no trust-on-first-use scan, no
# host-key checking disabled) and never deletes remote files.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a legacy single-host deploy'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'deploy' }}
    defaults:
      run:
        working-directory: admin-back
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: legacy-deploy
    defaults:
      run:
        working-directory: admin-back
    env:
      SSH_TARGET: ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }}
      SSH_OPTS: -p ${{ secrets.PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install SSH key and pinned known_hosts
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          # SSH_KNOWN_HOSTS must hold the server's verified host key line(s).
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Create the release directory
        run: ssh $SSH_OPTS "$SSH_TARGET" "mkdir -p ~/payment-gateway/admin-back"

      - name: Sync (additive only)
        run: |
          rsync -avz --partial \
            --exclude 'certs' --exclude 'node_modules' --exclude 'generated' --exclude '.env*' \
            -e "ssh $SSH_OPTS" \
            ./ "$SSH_TARGET:~/payment-gateway/admin-back"

      - name: Install dependencies
        run: ssh $SSH_OPTS "$SSH_TARGET" 'cd ~/payment-gateway/admin-back && ~/.bun/bin/bun i --frozen-lockfile'

      - name: Restart the service
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" 'export PATH="$HOME/.bun/bin:$PATH" && pm2 restart payment-gateway-admin-back || pm2 start ~/payment-gateway/admin-back/pm2-compatible-start.js --name="payment-gateway-admin-back" --interpreter="$HOME/.bun/bin/bun"'
          ssh $SSH_OPTS "$SSH_TARGET" 'export PATH="$HOME/.bun/bin:$PATH" && pm2 save'
