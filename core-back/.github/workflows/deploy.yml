name: Deploy Core Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core-back/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-back

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Copy SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.PORT }} ${{ secrets.HOSTNAME }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }} "echo 'SSH Access Confirmed'"

      - name: Create the release directory
        run: |
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }} "mkdir -p ~/payment-gateway/core-back"

      - name: Sync the core engine
        run: |
          rsync -avz \
            --delete \
            --info=progress2 \
            --partial \
            --exclude 'certs' \
            --exclude 'node_modules' \
            --exclude 'generated' \
            -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }}:~/payment-gateway/core-back

      - name: Install dependencies
        run: |
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }} "cd ~/payment-gateway/core-back && ~/.bun/bin/bun i --frozen-lockfile"

      - name: Apply database migrations
        run: |
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }} 'export PATH="$HOME/.bun/bin:$PATH" && cd ~/payment-gateway/core-back && bun run migrate-deploy'

      - name: Generate the Prisma client
        run: |
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }} 'export PATH="$HOME/.bun/bin:$PATH" && cd ~/payment-gateway/core-back && bun run migrate-generate'

      - name: Restart the core service
        run: |
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }} 'export PATH="$HOME/.bun/bin:$PATH" && pm2 restart payment-gateway-core || pm2 start ~/payment-gateway/core-back/pm2-compatible-start.js --name="payment-gateway-core" --interpreter="$HOME/.bun/bin/bun"'

      - name: Persist the process list
        run: |
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOSTNAME }} 'export PATH="$HOME/.bun/bin:$PATH" && pm2 save'
