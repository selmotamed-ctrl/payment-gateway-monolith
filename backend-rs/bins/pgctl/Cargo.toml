[package]
name = "pgctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pg-deploy-config.workspace = true
pg-deploy-plan.workspace = true
sha2.workspace = true
tokio.workspace = true
russh = { workspace = true, default-features = false, features = ["ring", "rsa"] }
minisign.workspace = true
nix.workspace = true
walkdir.workspace = true
tempfile.workspace = true
mimalloc.workspace = true

# D4-T01/T02: in-process PKI (no openssl binary on the operator host). The `x509-parser` feature
# lets `Issuer::from_ca_cert_pem` sign new leaves from the stored intermediate CA; `verify`
# enables certificate signature verification.
rcgen = { workspace = true, features = ["x509-parser"] }
x509-parser = { workspace = true, features = ["verify"] }
